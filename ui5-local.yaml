# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: zpncnd.datos.maestros.pncnddatosmaestros
type: application
framework:
  name: SAPUI5
  version: 1.141.3
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.comp
    - name: sap.ui.table
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /odata/v2/raizen
            destination: api-cap-portal-nc-nd-masterdata
